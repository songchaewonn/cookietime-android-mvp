name: Build and publish Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release version tag
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/chagok-${TAG_NAME}.apk"
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chagok ${TAG_NAME}" \
              --notes "chagok Android install build. This debug-signed APK is for direct testing."
          fi
          gh release upload "$TAG_NAME" "$RUNNER_TEMP/chagok-${TAG_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
